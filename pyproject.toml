[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yifei-platform"
version = "0.8.0"
description = "Versioned shared market facts and neutral capabilities for Yifei applications."
requires-python = ">=3.11"

[project.optional-dependencies]
public-data = [
  "akshare>=1.18.55",
  "baostock>=0.9.3",
  "levistock>=0.1.0",
]

[project.scripts]
yifei-platform-bootstrap = "yifei_platform.bootstrap_cli:main"
yifei-platform-publish-transitional = "yifei_platform.transitional_cli:main"
yifei-platform-supplemental = "yifei_platform.supplemental_cli:main"
yifei-platform-turnover-snapshot = "yifei_platform.turnover_cli:main"
yifei-platform-publish-turnover-enriched = "yifei_platform.turnover_publish_cli:main"
yifei-platform-turnover-reference = "yifei_platform.turnover_reference_cli:main"
yifei-platform-publish-exchange-calendar = "yifei_platform.exchange_calendar_cli:main"
yifei-platform-publish-daily-market = "yifei_platform.daily_market_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
